modLoader="javafml"
loaderVersion="${loader_version_range}"

license="All Rights Reserved"
#issueTrackerURL=

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    #displayURL=
    authors="Me!"
    #credits=
    logoFile="assets/${mod_id}/icon.png"
    description="It's an example mod!"
    #updateJSONURL="https://api.modrinth.com/updates/{slug|ID}/forge_updates.json?neoforge=only"

#[[mixins]]
    #config="META-INF/${mod_id}.mixins.json"

#[[accessTransformers]]
    #file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
